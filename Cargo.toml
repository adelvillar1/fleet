[package]
name = "fleet"
version = "0.2.0"
edition = "2021"
description = "Fleet: a native Rust agent based on DeepSeek Harness"
license = "MIT"
publish = false

[lib]
name = "fleet"
path = "src/lib.rs"

[[bin]]
name = "fleet"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
ureq = { version = "2", features = ["json", "gzip"] }

[profile.release]
strip = true
lto = true
