[package]
name = "fleet"
version = "0.9.3"
edition = "2021"
description = "Fleet: a native Rust agent based on DeepSeek Harness"
license = "MIT"
publish = false

[lib]
name = "fleet"
path = "src/lib.rs"

[[bin]]
name = "fleet"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in the graph through ratatui-core: declaring it directly adds
# no crate to the binary. KI-025 — the TUI's wrapping, cursor, and
# truncation math counted characters, so CJK, emoji, and combining-mark
# input mis-wrapped; a display-cell measure is what those inputs need.
unicode-width = "0.2"
# The doctor's disk line reads the volume directly (statvfs) rather than
# shelling out to df: a doctor that needs a binary on PATH reports a broken
# machine when the PATH is merely narrow (the install tests' own shape,
# KI-385). libc is already in the graph through tokio and arboard, so
# declaring it adds no crate to the binary.
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process", "net", "signal"] }
ureq = { version = "2", features = ["json", "gzip"] }
# The relay's end-to-end seal. The frame key comes from an X25519
# exchange through the relay, so neither side can be swapped for
# hand-rolled bytes: the endpoints must agree on the curve and the AEAD
# to the bit, and the phone's half is the browser's own WebCrypto.
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
ring = "0.17"
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-md = "0.5.4"
tree-sitter-typescript = "0.23.2"
tree-sitter-json = "0.24.8"
tree-sitter-bash = "0.25.1"
arboard = "3.7.0"
png = "0.18.1"
cpal = "0.18.2"

# The faces' assets are compressed once, at build time, into OUT_DIR
# (`build.rs`), and embedded beside the raw copy — so the served path has
# no encoder in it and the crate carries no new runtime dependency.
# flate2 is already in the graph through ureq's gzip, so this declares a
# crate the lock already holds rather than adding one.
[build-dependencies]
flate2 = "1.1"

# The tests decode what the server answered: the round-trip test is the
# proof that the compressed body is the identity body.
[dev-dependencies]
flate2 = "1.1"

# The gate and the inner loop build in dev; at full debuginfo this tree
# reached 22 GiB (deps 13.9, incremental 9.8) on a 16 GiB machine that ran
# out of headroom mid-gate. Line tables are enough to point a debugger at a
# line; the type detail full debuginfo buys is not what these builds are for.
[profile.dev]
debug = 1
# A 267K-line crate has no useful unit boundary for incremental compilation;
# it cost ~9 GiB and a fingerprint check on every run.
incremental = false

[profile.release]
strip = true
# Fat LTO on two binaries (fleet + fleet-desktop) was the single longest phase
# of a gate run — 20m21s on a cold target, 3m45s warm — and its peak memory is
# what starved this machine mid-gate (0.07 GiB free, 16.1M pageouts, a run
# refused by Fleet's own admission control). Thin LTO keeps cross-crate
# inlining and costs a few percent of runtime; the owner's ruling of
# 2026-11-20 is to take that trade.
lto = "thin"

# The native shell is its own crate so the main binary stays
# dependency-light. The workspace makes the gate cover both crates:
# `src-tauri` depends on this crate by path and reuses the same bridge,
# the same server, and the same home (hard rule 12).
[workspace]
members = ["src-tauri"]
# The gate's commands run at the repo root, so the default members are
# what make `cargo clippy --all-targets` and `cargo test` cover the shell
# too (the native shell plan's C0). Without this they would build only
# the `fleet` package.
default-members = [".", "src-tauri"]
