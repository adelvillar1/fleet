[package]
name = "fleet"
version = "0.6.10"
edition = "2021"
description = "Fleet: a native Rust agent based on DeepSeek Harness"
license = "MIT"
publish = false

[lib]
name = "fleet"
path = "src/lib.rs"

[[bin]]
name = "fleet"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in the graph through ratatui-core: declaring it directly adds
# no crate to the binary. KI-025 — the TUI's wrapping, cursor, and
# truncation math counted characters, so CJK, emoji, and combining-mark
# input mis-wrapped; a display-cell measure is what those inputs need.
unicode-width = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process", "net", "signal"] }
ureq = { version = "2", features = ["json", "gzip"] }
# The relay's end-to-end seal. The frame key comes from an X25519
# exchange through the relay, so neither side can be swapped for
# hand-rolled bytes: the endpoints must agree on the curve and the AEAD
# to the bit, and the phone's half is the browser's own WebCrypto.
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-md = "0.5.4"
tree-sitter-typescript = "0.23.2"
tree-sitter-json = "0.24.8"
tree-sitter-bash = "0.25.1"
arboard = "3.7.0"
png = "0.18.1"

[profile.release]
strip = true
lto = true

# The native shell is its own crate so the main binary stays
# dependency-light. The workspace makes the gate cover both crates:
# `src-tauri` depends on this crate by path and reuses the same bridge,
# the same server, and the same home (hard rule 12).
[workspace]
members = ["src-tauri"]
# The gate's commands run at the repo root, so the default members are
# what make `cargo clippy --all-targets` and `cargo test` cover the shell
# too (the native shell plan's C0). Without this they would build only
# the `fleet` package.
default-members = [".", "src-tauri"]
