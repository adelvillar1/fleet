<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover is what makes env(safe-area-inset-*) non-zero;
     without it the home indicator and the notch are the app's problem. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>fleet bot</title>
<meta name="theme-color" content="#f6f4ef">
<link rel="manifest" href="/bot.webmanifest">
<link rel="apple-touch-icon" sizes="192x192" href="/bot-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="fleet bot">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="/bot.css?v=__FLEET_ASSET_HASH__">
<script>
  // The theme is set before the first paint, from the same storage the
  // console writes — the bot speaks the console's three themes.
  try {
    document.documentElement.dataset.theme =
      window.localStorage.getItem('fleet-theme-2') || 'paper';
  } catch (error) {
    document.documentElement.dataset.theme = 'paper';
  }
</script>
</head>
<body>
<div id="app"></div>
<script src="/bot.js?v=__FLEET_ASSET_HASH__" defer></script>
<script>
  // Installability. Nothing registered the bot worker before this: the
  // install was offered and the installed app had no shell at all
  // (KI-588). The registration is versioned the way the console's is —
  // the asset hash the server substitutes — so a new build's script is a
  // new URL, the browser installs it, and its activate deletes the
  // previous cache. A worker needs a secure context: loopback and the
  // tailnet HTTPS origin qualify, plain-HTTP LAN does not, and there the
  // face stays an ordinary page rather than pretending.
  (function () {
    if (!('serviceWorker' in navigator) || !window.isSecureContext) return;
    // A relayed page lives under /s/<sid>/ on an origin shared with every
    // other session there: its assets' paths carry that prefix, so a
    // worker registered from it could not cache them — and its scope
    // would be someone else's session. No install there.
    if (window.location.pathname.indexOf('/s/') === 0) return;
    window.addEventListener('load', function () {
      navigator.serviceWorker
        .register('/bot-sw.js?v=__FLEET_ASSET_HASH__', { scope: '/' })
        .catch(function () {});
    });
  })();
</script>
</body>
</html>
