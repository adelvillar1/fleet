[package]
name = "fleet-desktop"
version = "0.5.1"
edition = "2021"
description = "Fleet's native shell — the face in its own window"
license = "MIT"
publish = false

[lib]
name = "fleet_desktop"
path = "src/lib.rs"

[[bin]]
name = "fleet-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
fleet = { path = ".." }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "net"] }
url = "2"
