<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fleet</title>
    <style>
      /* The shell's first paint: the window opens on this page for the
         moment between the window existing and the loopback origin
         answering. It is replaced by the face as soon as the window
         navigates, and it carries the house palette so the gap reads as
         the app rather than as a broken page. */
      :root { color-scheme: light; }
      html, body { height: 100%; margin: 0; }
      body {
        background: #f6f4ef;
        color: #1c1a17;
        font-family: ui-serif, "Iowan Old Style", Georgia, serif;
        display: grid;
        place-items: center;
      }
      main { text-align: center; }
      h1 { font-size: 28px; letter-spacing: 0.04em; margin: 0 0 12px; }
      p { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; opacity: 0.6; margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>fleet</h1>
      <p>starting the face…</p>
    </main>
  </body>
</html>
